<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Effort Jackpot – Admin</title><style>body{font-family:Arial,sans-serif;max-width:460px;margin:20px auto;padding:0 14px;color:#14307a}
textarea,input{width:100%;padding:10px;margin:6px 0;border:1px solid #9fb0d3;border-radius:6px;font:inherit;box-sizing:border-box}
button{background:#14307a;color:#fff;border:0;border-radius:6px;padding:10px 16px;font:inherit;margin:4px 6px 4px 0}#out{color:#c8102e;white-space:pre-wrap}</style></head><body>
<h2>Effort Jackpot – Admin</h2><input id="k" type="password" placeholder="Admin password">
<textarea id="t" rows="6" placeholder="Paste one or many M-Pesa messages"></textarea><button id="go">Add messages</button>
<hr><input id="a" type="number" placeholder="Amount (Ksh) for cash/other"><input id="n" placeholder="Name (optional)"><button id="man">Add amount</button>
<hr><button id="exp">Download backup</button><div id="out"></div>
<script>const $=i=>document.getElementById(i),q=()=>encodeURIComponent($('k').value);
$('go').onclick=async()=>{const parts=$('t').value.split(/(?=\b[A-Z0-9]{10}\s+Confirmed)/).filter(x=>x.trim());let r=[];
for(const p of parts){try{const x=await fetch('/webhook/sms?key='+q(),{method:'POST',body:JSON.stringify({message:p})});r.push(x.status==401?'WRONG PASSWORD':(await x.json()).result)}catch(e){r.push('error')}}
$('out').textContent=r.join(', ')||'Nothing to add';$('t').value=''};
$('man').onclick=async()=>{const x=await fetch('/admin/add?key='+q()+'&amount='+$('a').value+'&name='+encodeURIComponent($('n').value));$('out').textContent=x.status==401?'WRONG PASSWORD':JSON.stringify(await x.json())};
$('exp').onclick=()=>location='/admin/export?key='+q();</script></body></html>
